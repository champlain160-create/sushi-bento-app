name: Build Kivy APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential git python3-dev \
          ffmpeg libsdl2-dev libsdl2-image-dev \
          libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libjpeg-dev libpng-dev libtiff-dev \
          libopenal-dev libpulse-dev libvorbis-dev \
          libxcb1-dev libxcb-shm0-dev \
          libxcb-xv0-dev libxcb-keysyms1-dev \
          libxcb-randr0-dev libxcb-shape0-dev \
          libxcb-sync-dev libxcb-xfixes0-dev \
          libxcb-dri3-dev libxcb-util-dev \
          libx11-dev libxext-dev libxrender-dev \
          libxcomposite-dev libxdamage-dev \
          libxfixes-dev libxcursor-dev libxi-dev \
          libxinerama-dev libxrandr-dev \
          libxtst-dev libxss-dev libxvmc-dev \
          libxxf86vm-dev libasound2-dev \
          libpulse-dev libudev-dev \
          libusb-1.0-0-dev libmtdev-dev \
          libgl1-mesa-dev openjdk-17-jdk \
          unzip autoconf libtool cmake pkg-config

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Accept Android SDK licenses
      run: |
        mkdir -p ~/.android
        echo "count=0" > ~/.android/repositories.cfg
        yes | buildozer android debug 2>&1 | grep -q "Accept? (y/N)" || true

    - name: Create buildozer.spec and build
      run: |
        buildozer init
        sed -i 's/title = My Application/title = 寿司餐盒管理系统/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = sushibento/' buildozer.spec
        sed -i 's/package.domain = org.test/package.domain = com.sushi/' buildozer.spec
        sed -i 's/version = 0.1/version = 1.0.0/' buildozer.spec
        sed -i 's/# android.ndk = 23b/android.ndk = 23c/' buildozer.spec
        sed -i 's/# android.sdk = 30/android.sdk = 33/' buildozer.spec
        sed -i 's/# android.api = 30/android.api = 33/' buildozer.spec
        sed -i 's/# android.minapi = 21/android.minapi = 21/' buildozer.spec
        sed -i 's/# android.permissions =/android.permissions = INTERNET, WRITE_EXTERNAL_STORAGE, READ_EXTERNAL_STORAGE, CAMERA/' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,kivy==2.2.1/' buildozer.spec
        sed -i '/source.include_exts/d' buildozer.spec
        sed -i '/source.dir = .*/a source.include_exts = py,png,jpg,kv,atlas' buildozer.spec
        yes | buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: sushi-bento-apk
        path: bin/*.apk
        retention-days: 30
